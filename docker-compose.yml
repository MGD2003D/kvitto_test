services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kvitto
      POSTGRES_PASSWORD: kvitto
      POSTGRES_DB: kvitto
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kvitto -d kvitto"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://kvitto:kvitto@db:5432/kvitto
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
